apiVersion: apps/v1
kind: Deployment
metadata:
  name: lovable-proxy
  namespace: lovable-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lovable-proxy
  template:
    metadata:
      labels:
        app: lovable-proxy
    spec:
      containers:
        - name: proxy
          # Make sure you built your Node.js code into a Docker image with this exact name locally
          image: lovable-proxy:latest
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
          env:
            - name: REDIS_URL
              # This works automatically because Redis is in the same 'lovable-dev' namespace
              value: "redis://redis-service:6379"
          ports:
            - containerPort: 80

---

apiVersion: v1
kind: Service
metadata:
  name: lovable-proxy-svc
  namespace: lovable-dev
spec:
  # LoadBalancer automatically exposes port 80 to your local machine (localhost)
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
  selector:
    app: lovable-proxy